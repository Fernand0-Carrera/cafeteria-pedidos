name: CI

on:
  push:
    branches: [main, develop, documentacion]
  pull_request:

jobs:
  calidad:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install pytest==9.2.0 pytest-cov==7.1.0 pylint==4.1.3 flake8==7.5.0 bandit==1.9.4
      - name: Estilo (flake8)
        run: flake8 app tests run.py
      - name: Análisis (pylint)
        run: pylint app run.py --fail-under=9.0
      - name: Seguridad (bandit)
        run: bandit -r app run.py -ll
      - name: Pruebas y cobertura
        run: pytest --cov=app --cov-branch --cov-report=term-missing --cov-report=html --cov-fail-under=85
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cobertura-py${{ matrix.python-version }}
          path: htmlcov
