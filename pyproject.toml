[project]
name = "cafeteria-pedidos"
version = "1.0.0"
description = "Gestión de pedidos de una cafetería universitaria (Release 1.0)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.pylint.main]
ignore = ["instance", "docs"]

[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
# Las pruebas usan fixtures con el mismo nombre que los parámetros (patrón propio de pytest).
disable = []

[tool.bandit]
exclude_dirs = ["tests", "docs", "instance"]
